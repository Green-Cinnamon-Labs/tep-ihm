<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TEP — Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1a1a2e;
      --surface:  #16213e;
      --border:   #2a2a4a;
      --text:     #c8ccd8;
      --muted:    #6b7280;
      --accent:   #4fc3f7;
      --warning:  #ffd54f;
      --alarm:    #ef5350;
      --active:   #66bb6a;
      --header-h: 52px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; }

    /* ── Header ── */
    #analytics-header {
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
    }
    .back-link { color: var(--accent); text-decoration: none; font-size: 12px; white-space: nowrap; }
    .back-link:hover { text-decoration: underline; }
    .header-title { font-weight: 600; font-size: 14px; white-space: nowrap; }
    .header-sep { color: var(--border); }
    .capture-controls { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .dot { font-size: 16px; }
    .dot-idle    { color: var(--muted); }
    .dot-active  { color: var(--active); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    #capture-name {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 4px;
      width: 200px;
      font-size: 12px;
    }
    #capture-name::placeholder { color: var(--muted); }

    button {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: var(--border); }
    button:disabled { opacity: 0.4; cursor: default; }
    button.primary { background: var(--accent); color: #000; border-color: var(--accent); }
    button.primary:hover:not(:disabled) { background: #29b6f6; }
    button.danger  { border-color: var(--alarm); color: var(--alarm); }
    button.danger:hover:not(:disabled) { background: rgba(239,83,80,0.15); }

    /* ── Main layout ── */
    #analytics-main {
      display: flex;
      height: calc(100vh - var(--header-h));
      margin-top: var(--header-h);
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 260px;
      min-width: 200px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #sidebar-inner {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .sidebar-section { margin-bottom: 16px; }
    .sidebar-section h4 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    #session-select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .session-meta { font-size: 11px; color: var(--muted); margin-bottom: 6px; line-height: 1.4; }

    .session-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    /* Time range */
    .range-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .range-row label { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
    .range-row input[type="number"] {
      width: 80px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 12px;
    }

    /* Variable picker */
    details { margin-bottom: 4px; }
    details summary {
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      padding: 4px 0;
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    details summary::before { content: '▶'; font-size: 9px; transition: transform 0.15s; }
    details[open] summary::before { transform: rotate(90deg); }
    .var-list { padding: 4px 0 4px 8px; }
    .var-item { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
    .var-item label { font-size: 11px; cursor: pointer; color: var(--text); line-height: 1.3; }
    .var-item input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }
    .var-item label span.unit { color: var(--muted); font-size: 10px; }

    /* ── Slots area ── */
    #slots-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 12px;
      gap: 12px;
    }
    #btn-add-slot {
      align-self: flex-start;
      margin-bottom: 8px;
    }

    /* ── Chart slot ── */
    .chart-slot {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      min-height: 260px;
    }
    .slot-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    .slot-title { font-size: 12px; font-weight: 600; flex: 1; }
    .slot-selected-vars { font-size: 11px; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slot-body {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    .slot-chart {
      flex: 1;
      min-height: 220px;
    }

    /* Resize handle between slots */
    .slot-resize-handle {
      height: 6px;
      cursor: ns-resize;
      background: transparent;
    }
    .slot-resize-handle:hover { background: var(--border); }

    /* Empty state */
    .slot-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 180px;
      color: var(--muted);
      font-size: 12px;
      flex-direction: column;
      gap: 8px;
    }

    /* Per-slot fetch + poll buttons */
    .slot-btn-fetch { background: var(--accent); color: #000; border-color: var(--accent); font-size: 11px; padding: 3px 8px; }
    .slot-btn-fetch:hover:not(:disabled) { background: #29b6f6; }
    .slot-btn-poll  { font-size: 11px; padding: 3px 8px; }
    .slot-btn-poll.poll-active { color: var(--active); border-color: var(--active); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header id="analytics-header">
  <a href="/" class="back-link">← IHM</a>
  <span class="header-sep">|</span>
  <span class="header-title">TEP Analytics</span>
  <div class="capture-controls">
    <span id="capture-dot" class="dot dot-idle" title="Capture status">●</span>
    <input id="capture-name" type="text" placeholder="Session name…" maxlength="80">
    <button id="btn-new-session">+ Session</button>
    <button id="btn-start-capture" class="primary" disabled>▶ Start</button>
    <button id="btn-stop-capture" disabled>■ Stop</button>
    <span class="header-sep">|</span>
    <span id="capture-label" style="font-size:11px;color:var(--muted)">idle</span>
    <span id="capture-vars-label" style="font-size:10px;color:var(--muted);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
  </div>
</header>

<div id="analytics-main">

  <aside id="sidebar">
    <div id="sidebar-inner">

      <div class="sidebar-section">
        <h4>Session</h4>
        <select id="session-select">
          <option value="">— select session —</option>
        </select>
        <div id="session-meta" class="session-meta"></div>
        <div class="session-actions">
          <button id="btn-refresh-sessions" title="Refresh session list">⟳</button>
          <button id="btn-export-session" disabled>↓ CSV</button>
          <button id="btn-delete-session" class="danger" disabled>✕ Delete</button>
        </div>
      </div>

      <div class="sidebar-section">
        <h4>Time range (t_h)</h4>
        <div class="range-row">
          <label>From<input id="th-from" type="number" step="0.1" placeholder="auto"></label>
          <label>To<input id="th-to" type="number" step="0.1" placeholder="auto"></label>
        </div>
      </div>

      <div class="sidebar-section">
        <h4>Variables</h4>
        <div id="var-picker"></div>
      </div>

      <div class="sidebar-section" style="display:flex;flex-direction:column;gap:6px">
        <button id="btn-add-capture" class="primary" style="width:100%">+ Add capture</button>
      </div>

    </div>
  </aside>

  <div id="slots-area">
    <button id="btn-add-slot">+ Add chart</button>
  </div>

</div>

<script src="/static/analytics/analytics.js"></script>
</body>
</html>
