<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEP IHM — Tennessee Eastman Process</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Header -->
    <header id="header">
        <span class="header-title">Tennessee Eastman Process</span>
        <span id="sim-time" class="header-info">t = --</span>
        <span id="plant-status" class="header-info status-tag">--</span>
        <span id="connection-status" class="header-info status-disconnected">desconectado</span>
        <button id="btn-reconnect" onclick="reconnectPlant()" class="sim-control-btn" style="display:none;">⟳ Tentar conectar</button>
        <span id="rec-controls" class="header-rec">
            <button id="btn-rec-start" class="rec-btn rec-btn-start" title="Inicia gravação (cria novo CSV)">⏹ Record</button>
            <button id="btn-rec-stop" class="rec-btn rec-btn-stop" title="Para gravação" disabled>⏸ Stop</button>
            <a id="btn-rec-download" class="rec-btn rec-btn-download" href="/recording.csv" download="recording.csv" title="Baixa CSV gravado">⬇ Download</a>
            <span id="rec-status" class="rec-status">parado</span>
            <span id="rec-timer" class="rec-timer">00:00</span>
        </span>
        <button id="btn-sim-pause" class="sim-control-btn sim-running" title="Pause simulation">⏸ Pause</button>
        <div class="demo-dropdown-wrap">
            <button id="btn-demo" class="sim-control-btn" onclick="toggleDemoDropdown()" title="Demonstrações visuais ISA-101">▶ Demo ▾</button>
            <div id="demo-dropdown" class="demo-dropdown" hidden>
                <!-- preenchido por demo.js -->
            </div>
        </div>
        <button id="btn-idv" class="sim-control-btn" onclick="toggleIdvPanel()" title="Painel de distúrbios IDV">⚡ IDV</button>
        <button id="btn-console" class="sim-control-btn" onclick="toggleConsolePanel()" title="Console de logs">▣ Console</button>
        <a href="/analytics" class="sim-control-btn" style="text-decoration:none" title="Painel analítico — séries temporais">📈 Analytics</a>
    </header>

    <!-- IDV disturbances floating panel -->
    <div id="idv-panel" class="idv-panel" hidden>
        <div class="idv-panel-header">
            <span>⚡ DISTÚRBIOS — IDV</span>
            <button onclick="_setPanel('idv-panel','btn-idv',false)" class="idv-panel-close">✕</button>
        </div>
        <div id="idv-list" class="idv-panel-body"></div>
    </div>

    <!-- Console panel -->
    <div id="console-panel" class="demo-panel" hidden>
        <div class="demo-panel-header">
            <span>▣ CONSOLE</span>
            <button onclick="_setPanel('console-panel','btn-console',false)" class="demo-close">✕</button>
        </div>
        <div id="console-log" class="demo-log"></div>
    </div>

    <!-- ISD Banner (hidden by default) -->
    <div id="isd-banner" class="isd-banner" hidden>EMERGENCY SHUTDOWN (ISD)</div>

    <main>
        <!-- Row 1: Solver + Alarms -->
        <div class="row-split">
            <section id="solver-panel" class="panel panel-narrow">
                <h2>Solver</h2>
                <table id="solver-table" class="kv-table">
                    <tr><td>|dy/dt|</td><td id="solver-deriv">--</td></tr>
                    <tr><td>Status</td><td id="solver-status">--</td></tr>
                </table>
            </section>

            <!-- Alarms moved to SVG diagram badges (ISA-101) -->
            <div hidden>
                <div id="alarms-col-left"></div>
                <div id="alarms-col-right"></div>
            </div>
        </div>

        <!-- Diagram: full remaining area -->
        <section class="panel panel-diagram">
            <div id="diagram-container">
            <!-- SVG injetado via JS a partir de plant-diagram.svg -->
            </div>
        </section>

        <!-- Hidden panels — mantidos no DOM para não quebrar app.js -->
        <div hidden>
            <canvas id="chart-pressure"></canvas>
            <canvas id="chart-temperature"></canvas>
            <canvas id="chart-levels"></canvas>
            <canvas id="chart-flows"></canvas>
            <table id="xmeas-table"><tbody></tbody></table>
            <table id="xmv-table"><tbody></tbody></table>
            <div id="_idv-list-placeholder" style="display:none"></div>
            <div id="operator-content">
                <table id="operator-meta-table">
                    <tr><td></td><td id="op-phase"></td></tr>
                    <tr><td></td><td id="op-time"></td></tr>
                    <tr><td></td><td id="op-isd"></td></tr>
                    <tr><td></td><td id="op-reconcile"></td></tr>
                    <tr><td></td><td id="op-last-action"></td></tr>
                </table>
                <table id="operator-vars-table"><tbody id="op-vars-tbody"></tbody></table>
            </div>
            <div class="resizable-divider" id="resize-divider"></div>
        </div>
    </main>

    <script src="/static/diagram-adapter.js"></script>
    <script src="/static/diagram-animator.js"></script>
    <script src="/static/app.js"></script>
    <script src="/static/demo.js"></script>
</body>
</html>
